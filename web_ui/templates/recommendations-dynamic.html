<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommendations - Dynamic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .navbar { background: linear-gradient(90deg, #2c3e50 0%, #3498db 100%); }
        .container-main { padding: 30px 20px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); background: white; }
        .rec-card { padding: 20px; margin-bottom: 15px; border-left: 4px solid #3498db; border-radius: 8px; background: #f8f9fa; transition: all 0.3s; }
        .rec-card:hover { background: #f0f3f7; transform: translateX(5px); }
        .priority-high { border-left-color: #e74c3c; }
        .priority-medium { border-left-color: #f39c12; }
        .priority-low { border-left-color: #27ae60; }
        .priority-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; margin-right: 10px; text-transform: uppercase; }
        .badge-high { background: #e74c3c; color: white; }
        .badge-medium { background: #f39c12; color: white; }
        .badge-low { background: #27ae60; color: white; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">📊 Portfolio Agent</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="/portfolio">Portfolio</a></li>
                    <li class="nav-item"><a class="nav-link" href="/scenarios">Scenarios</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/recommendations">Recommendations</a></li>
                    <li class="nav-item"><a class="nav-link" href="/reports">Reports</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid container-main">
        <h1 style="color: white; margin-bottom: 30px;">💡 Portfolio Recommendations</h1>

        <div id="recommendationsContainer" style="min-height: 400px;">
            <div class="text-center" style="color: white; padding: 50px;">
                <p>Loading recommendations...</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function loadRecommendations() {
            fetch('/api/recommendations')
                .then(r => r.json())
                .then(data => displayRecommendations(data))
                .catch(e => {
                    console.error(e);
                    document.getElementById('recommendationsContainer').innerHTML = '<p style="color: white;">Error loading recommendations</p>';
                });
        }

        function displayRecommendations(data) {
            const container = document.getElementById('recommendationsContainer');
            
            if (!data.recommendations || data.recommendations.length === 0) {
                container.innerHTML = '<p style="color: white;">No recommendations available.</p>';
                return;
            }

            let html = '';
            data.recommendations.forEach((rec, idx) => {
                const priority = rec.priority || 'medium';
                const priorityClass = `priority-${priority.toLowerCase()}`;
                const badgeClass = `badge-${priority.toLowerCase()}`;
                
                html += `
                    <div class="card" style="margin-bottom: 20px;">
                        <div class="rec-card ${priorityClass}">
                            <div style="display: flex; justify-content: space-between; align-items: start;">
                                <div style="flex: 1;">
                                    <h5 style="margin: 0 0 10px 0;">${rec.title || 'Recommendation ' + (idx + 1)}</h5>
                                    <p style="color: #7f8c8d; margin: 0 0 10px 0;">${rec.description || ''}</p>
                                    
                                    ${rec.impact ? `<p style="margin: 10px 0;"><strong>Impact:</strong> ${rec.impact}</p>` : ''}
                                    ${rec.action ? `<p style="margin: 10px 0;"><strong>Recommended Action:</strong> ${rec.action}</p>` : ''}
                                    ${rec.supporting_data ? `<p style="margin: 10px 0; font-size: 0.9rem; color: #7f8c8d;"><strong>Supporting Data:</strong> ${rec.supporting_data}</p>` : ''}
                                </div>
                                <span class="priority-badge ${badgeClass}" style="white-space: nowrap;">${priority}</span>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        loadRecommendations();
    </script>
</body>
</html>
